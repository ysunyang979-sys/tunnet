name: Hourly TunNet Node Sync

on:
  schedule:
    - cron: '0 * * * *'  # 每 1 小时自动运行
  workflow_dispatch:       # 支持在 GitHub 页面手动一键点击运行
  push:
    branches:
      - main
    paths-ignore:
      - 'sub/**'
      - 'index.html'
      - 'README.md'

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Fetch and Convert Nodes
        run: |
          python fetch_and_convert.py

      - name: Commit and Push Subscriptions
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sub/ index.html
          $changes = git status --porcelain
          if ($changes) {
              Write-Host "Changes detected, committing and pushing..."
              git commit -m "Auto-update nodes & subscriptions [skip ci]"
              git push origin main
          } else {
              Write-Host "No changes to commit, subscriptions are up to date."
          }
